{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-4rem)] px-4">
  <div class="text-center">
    <div class="inline-flex w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500/20 to-rose-500/20
                border border-red-500/20 items-center justify-center mb-6">
      <i class="fa-solid {% if code == 404 %}fa-compass-slash{% elif code == 403 %}fa-lock{% else %}fa-triangle-exclamation{% endif %}
                text-red-400 text-3xl"></i>
    </div>
    <h1 class="text-7xl font-bold text-white/10 mb-2">{{ code }}</h1>
    <h2 class="text-2xl font-semibold text-white mb-3">
      {% if code == 404 %}Page Not Found{% elif code == 403 %}Access Denied{% else %}Server Error{% endif %}
    </h2>
    <p class="text-slate-400 mb-8 max-w-sm mx-auto">{{ message }}</p>
    <a href="{{ url_for('auth.index') }}"
       class="btn-primary inline-flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Go Home
    </a>
  </div>
</div>
{% endblock %}
